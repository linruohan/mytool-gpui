[package]
name = "gpui-fps"
description = "Realtime FPS, frame time, CPU and memory HUD for GPUI applications."
keywords = ["fps", "gpui", "hud", "performance", "profiling"]
license = "Apache-2.0"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
doctest = false

[dependencies]
# 注意：新版 gpui 的 FrameTiming/FrameTimingCollector 需要启用 profiler feature
gpui = { git = "https://github.com/zed-industries/zed", features = ["profiler"] }
instant = { version = "0.1", features = ["wasm-bindgen"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
sysinfo = "0.37"

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", features = ["test-support", "profiler"] }
