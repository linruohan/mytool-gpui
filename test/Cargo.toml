[package]
name = "my-test"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
futures = "0.3.33"
rayon = "1.12.0"
smol = "2.0.2"

[dependencies.todos]
path = "../crates/todos"

# gconfig 提供全局配置读取（db_test 使用）
[dependencies.gconfig]
path = "../crates/gconfig"

[dependencies.sea-orm]
version = "1.1.20"
features = [
    "with-chrono",
    "with-json",
    "with-uuid",
    "debug-print",
    "sqlx-sqlite",
    "runtime-tokio",
]

# 继承工作区统一的 clippy lint 配置
[lints]
workspace = true

