[workspace.package]
publish = false
edition = "2024"
[workspace]
members = ["crates/mytool", "crates/todos", "crates/gconfig", "test"]

default-members = ["crates/mytool"]
resolver = "2"

[workspace.dependencies]
# inner crates
todos = { path = "crates/todos" }     # todos库，提供核心的任务管理功能
mytool = { path = "crates/mytool" }   # 主工具库，包含核心功能和命令行接口
gconfig = { path = "crates/gconfig" } # 全局配置管理库
# gpui - 启用 profiler feature 以导出 FrameTiming/FrameTimingCollector
gpui = { git = "https://github.com/zed-industries/zed", features = ["profiler"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }
gpui_macros = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/linruohan/gpui-component.git", features = [
    "tree-sitter-languages",
] }
gpui-component-assets = { git = "https://github.com/linruohan/gpui-component.git" }
# 修复：使用本地修复后的 gpui-fps（已适配新版 gpui 的 FrameEvent/set_trace_enabled API）
gpui-fps = { path = "third-party/gpui-fps" }
# External crates
anyhow = "1.0.104"
# rand = "0.8.5"
# 启用 small_rng 特性，使用更快的随机数生成器
rand = { version = "0.8.7", features = ["small_rng"] }
tokio = { version = "1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
paste = "1.0.15"
rust-i18n = "4"
sea-orm = { version = "1.1.20", features = [
    "with-chrono",
    "with-json",
    "with-uuid",
    "sqlx-sqlite",
    "runtime-tokio",
] }
winresource = "0.1.31"
rodio = "0.21.1"
tracing = { version = "0.1.44", features = ["async-await"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "chrono"] }
chrono = { version = "0.4.45", features = ["serde"] }
smallvec = { version = "1.15", features = ["union"] }
rfd = "0.14"
# Additional dependencies used by multiple crates
thiserror = "2.0.19"
async-trait = "0.1.91"
# futures = "0.3.31"
# 精简特性，减少编译时间和体积
futures = { version = "0.3.33", default-features = false, features = [
    "std",
    "async-await",
    "executor",
] }
strum = { version = "0.27.2", features = ["derive"] }
uuid = { version = "1.24.0", features = [
    "v4",
    "fast-rng",
    "macro-diagnostics",
] }
itertools = "0.14.0"
toml = "0.8.23"
base64 = "0.22.1"
pbkdf2 = { version = "0.12.2", features = ["simple"] }
aes-gcm = "0.10.3"
password-hash = "0.5.0"
embed-resource = "3.0.11"

[workspace.lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
todo = "deny"
type_complexity = "allow"

[profile.dev]
# 开发模式使用较少的代码单元以加速编译
codegen-units = 16
# 使用默认的 LLVM 后端，比 Cranelift 更快更稳定
# split-debuginfo = "unpacked"
opt-level = 0
debug-assertions = false
overflow-checks = false
lto = false
panic = 'unwind'
incremental = true
rpath = false
# 禁用debug
debug = 0
# strip = "debuginfo"


[profile.dev.package]
# 对所有依赖使用最高优化级别以加速编译
"*" = { opt-level = 3 }
# 以下包保持原有配置，但已被上面的 "*" 覆盖
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
gpui = { opt-level = 3 }
gpui_platform = { opt-level = 3 }
gpui_macros = { opt-level = 3 }
tree-sitter = { opt-level = 3 }

[profile.release]
opt-level = 3
lto = true
codegen-units = 8
strip = true
debug = false

# 超快速开发模式 - 用于快速验证代码
[profile.fast]
inherits = "dev"
# 最大化并行编译单元
codegen-units = 256
# 最低优化级别
opt-level = 0
# 禁用所有检查
debug-assertions = false
overflow-checks = false
# 禁用 LTO
lto = false
# 禁用增量编译（配合 sccache 更快）
incremental = false
# 禁用调试信息
debug = 0

# 🔧 修复：用本地适配过新版 gpui API 的 gpui-fps 覆盖 git 来源的版本
[patch."https://github.com/linruohan/gpui-component.git"]
gpui-fps = { path = "third-party/gpui-fps" }
