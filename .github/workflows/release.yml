name: Release

# 触发条件：
# 1. 推送发布 tag：自动构建并发布正式 GitHub Release
#    兼容两种命名格式：v0.1.1（带 v 前缀）与 0.1.1（无前缀）
# 2. workflow_dispatch：在 Actions 页面手动触发，用于验证打包流程（产物上传为 Artifact）
on:
  push:
    tags:
      - "v*.*.*"
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: ""

jobs:
  windows:
    name: Build and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Build release
        run: cargo build --release -p mytool

      # 单 exe 直接发布：默认配置 application.toml 已编译期内嵌到 gconfig
      # （exe 同目录放置 application.toml 时仍优先使用，保留可配置性）。
      # themes 与 locales 已在编译期通过 include_str!/rust_i18n 嵌入。
      # assets/sounds/success.ogg 为可选资源，缺失时静默跳过播放，不影响功能。
      - name: Stage artifact
        shell: pwsh
        run: |
          # 版本号：tag 触发用 tag 名，手动触发用短 commit sha 标记为开发包
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME
          } else {
            $version = "dev-$($env:GITHUB_SHA.Substring(0, 7))"
          }

          Copy-Item "target/release/mytool.exe" "mytool-$version.exe"
          echo "ASSET=mytool-$version.exe" >> $env:GITHUB_ENV

      # 产物自检：exe 缺失时立即失败，避免发布空包
      - name: Verify artifact
        shell: pwsh
        run: |
          if (-not (Test-Path $env:ASSET)) { throw "exe 未生成: $env:ASSET" }
          Get-Item $env:ASSET | Select-Object Name, Length

      # tag 推送：创建正式 GitHub Release 并上传附件
      # overwrite_files：重打同名 tag 重新发布时，覆盖已存在的同名附件而不是报错
      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ env.ASSET }}
          fail_on_unmatched_files: true
          overwrite_files: true

      # 手动触发：不创建 Release，仅将压缩包上传为 Artifact 供下载验证
      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
