name: Release

# 触发条件：
# 1. 推送 v*.*.* 格式的 tag：自动构建并发布正式 GitHub Release
# 2. workflow_dispatch：在 Actions 页面手动触发，用于验证打包流程（产物上传为 Artifact）
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: ""

jobs:
  windows:
    name: Build and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Build release
        run: cargo build --release -p mytool

      # 汇总发布产物到独立目录后再压缩，保持 zip 内目录结构规整。
      # 注意：exe 启动时会在同目录查找 application.toml（缺失会直接退出），
      # 完成任务时播放 assets/sounds/success.ogg，因此这两个资源必须一并打包。
      # themes 与 locales 已在编译期通过 include_str!/rust_i18n 嵌入，无需打包。
      - name: Stage and package
        shell: pwsh
        run: |
          # 版本号：tag 触发用 tag 名，手动触发用短 commit sha 标记为开发包
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME
          } else {
            $version = "dev-$($env:GITHUB_SHA.Substring(0, 7))"
          }

          $pkg = "mytool-$version-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "$pkg/assets/sounds" | Out-Null

          # 拷贝可执行文件与运行时必需资源
          Copy-Item "target/release/mytool.exe" $pkg
          Copy-Item "application.toml" $pkg
          Copy-Item "assets/sounds/success.ogg" "$pkg/assets/sounds"

          # 压缩整个发布目录
          Compress-Archive -Path "$pkg/*" -DestinationPath "$pkg.zip" -Force

          echo "ASSET=$pkg.zip" >> $env:GITHUB_ENV

      # 产物自检：exe 与压缩包缺失时立即失败，避免发布空包
      - name: Verify artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "target/release/mytool.exe")) { throw "mytool.exe 未生成" }
          if (-not (Test-Path $env:ASSET)) { throw "压缩包未生成: $env:ASSET" }
          Get-Item $env:ASSET | Select-Object Name, Length

      # tag 推送：创建正式 GitHub Release 并上传附件
      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ env.ASSET }}
          fail_on_unmatched_files: true

      # 手动触发：不创建 Release，仅将压缩包上传为 Artifact 供下载验证
      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}
